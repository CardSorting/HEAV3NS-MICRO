# [LAYER: INFRASTRUCTURE]
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Rust Test, Flight Suite & Joyzoning Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run unit & integration tests
        run: cargo test
      - name: Build release binary & run Flight Test + Smoke verification
        run: |
          cargo build --release
          ./target/release/heav3ns-micro --flight
          ./target/release/heav3ns-micro --smoke
      - name: Run Joyzoning strict architectural audit
        run: npx -y heav3ns-joy@1.0.0 check . --theme strict --format github

