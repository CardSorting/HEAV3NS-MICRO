[package]
name = "heav3ns-micro"
version = "0.1.0"
edition = "2021"
description = "Hyper-efficient, zero-bloat micro agent runtime distilled from LUMI/HEAV3NS"
license = "Apache-2.0"

[[bin]]
name = "heav3ns-micro"
path = "src/main.rs"

[lib]
name = "heav3ns_micro"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
futures = "0.3"
regex = "1.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.40", features = ["full"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

